spring:
  application:
    name: smart-travel-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/smarttravel}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:123456}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      idle-timeout: 30000
      max-lifetime: 60000
      connection-timeout: 10000

  jpa:
    hibernate:
      ddl-auto: validate  # DEV: create-drop
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: false

  # Gmail SMTP — used for OTP emails (forgot password)
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:ncaulifla@gmail.com}
    password: ${MAIL_PASSWORD:cckk efld sqll fvxl}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

recommendation:
  service:
    url: ${RECOMMENDATION_SERVICE_URL:http://localhost:5000}

feign:
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 10000

server:
  port: ${SERVER_PORT:8000}

jwt:
  secret: ${JWT_SECRET:your-256-bit-secret-key-change-this-in-production}
  access-token-expiration-ms: 900000       # 15 minutes
  refresh-token-expiration-ms: 604800000   # 7 days

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  cookie:
    secure: ${COOKIE_SECURE:false}
  otp:
    expiry-minutes: 10       # OTP expires after 10 minutes
    length: 6                # 6-digit OTP
    from-email: ${MAIL_USERNAME:ncaulifla@gmail.com}
    from-name: "Smart Travel"
    request-cooldown-seconds: 60   # Minimum gap between /forgot-password requests per email
