services:
  - type: web
    name: smart-travel-ai
    env: docker
    rootDir: recommendation-service
    plan: free
    envVars:
      - fromGroup: smart-travel-secrets
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: CORS_ALLOWED_ORIGINS
        value: https://smart-travel-six.vercel.app,http://localhost:3000,http://localhost:5173

  - type: web
    name: smart-travel-backend
    env: docker
    rootDir: backend-core
    plan: free
    envVars:
      - fromGroup: smart-travel-secrets
      - key: SPRING_DATASOURCE_URL
        value: jdbc:postgresql://aws-0-ap-northeast-2.pooler.supabase.com:5432/postgres
      - key: SPRING_DATASOURCE_USERNAME
        value: postgres.yixdtqoubebgqnxitqgn
      - key: JWT_SECRET
        value: A0QluOH5UtZ2D2gUJPlc7THmZEWZgXUwK1L0bCxVZGs=
      - key: SPRING_FLYWAY_BASELINE_ON_MIGRATE
        value: "true"
      - key: SPRING_FLYWAY_BASELINE_VERSION
        value: "0"
      - key: COOKIE_SECURE
        value: "true"
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: MAIL_USERNAME
        value: htv.nt9h@gmail.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://smart-travel-six.vercel.app,http://localhost:3000,http://localhost:5173
      - key: RECOMMENDATION_SERVICE_URL
